<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}UK economy model{% endblock %}</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      margin: 0; line-height: 1.5;
    }
    header { padding: 1rem 1.5rem; border-bottom: 1px solid #8884; }
    header a { text-decoration: none; color: inherit; font-weight: 600; }
    main { max-width: 960px; margin: 0 auto; padding: 1.5rem; }
    h1 { font-size: 1.5rem; margin: 0 0 .25rem; }
    .muted { opacity: .7; font-size: .9rem; }
    table { border-collapse: collapse; width: 100%; margin-top: 1rem; }
    th, td { text-align: left; padding: .5rem .75rem; border-bottom: 1px solid #8883; }
    td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
    tr:hover td { background: #8881; }
    a { color: #2563eb; }
    nav.levels { margin-top: 1rem; }
    nav.levels a { margin-right: .75rem; }
    nav.levels a.active { font-weight: 700; text-decoration: underline; }
  </style>
</head>
<body>
  <header><a href="/places/">UK economy model</a></header>
  <main>{% block content %}{% endblock %}</main>
</body>
</html>
