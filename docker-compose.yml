services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ukeconomy
      POSTGRES_USER: ukeconomy
      POSTGRES_PASSWORD: ukeconomy
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ukeconomy -d ukeconomy"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
